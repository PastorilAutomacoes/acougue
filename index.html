<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Açougue Pa$toril</title>
<meta name="theme-color" content="#1846C4">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Açougue">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de câmara fria — cabeçalho azul da marca com usuário e loja, abas fixas embaixo no celular (no topo no desktop), cartões brancos sobre fundo azulado; visor de balança azul-noite com números amarelos */
/* Paleta Pa$toril: azul da marca (identidade, seleção), laranja só no botão principal, amarelo $ nos destaques; verde/amarelo/vermelho só para o resultado */
:root{
  --bg:#EEF3FC; --surface:#FFFFFF; --surface-2:#E3EAF8; --fg:#0E1A3A; --muted:#55627F; --line:#D3DDF2;
  --accent:#1846C4; --accent-soft:#E3EBFF; --on-accent:#FFFFFF;
  --cta:#F26A1B; --cta-hover:#D95A0E; --on-cta:#FFFFFF; --gold:#FFC61A;
  --top-bg:#1846C4; --top-fg:#FFFFFF; --top-muted:#C9D7FF; --top-line:rgba(255,255,255,.28);
  --lcd-bg:#0B1F5C; --lcd-fg:#FFC61A; --lcd-dim:#8FA6E6;
  --ok:#16804A; --ok-soft:#DDF3E6; --warn:#855700; --warn-soft:#FFF1C2; --crit:#C62828; --crit-soft:#FDE1E1;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:10px;
  color-scheme:light; /* visual sempre claro, mesmo com o celular no modo escuro (escolha do cliente) */
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabeçalho */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);color:var(--top-fg);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:42px;height:42px;border-radius:10px;background:#FFFFFF;color:#1846C4;display:flex;align-items:center;justify-content:center;font-family:'Arial Black',var(--f-display);font-weight:900;font-size:13px;letter-spacing:-.04em;white-space:nowrap;flex:none}
.mark span,.brand b span{color:var(--gold)}
.brand b{display:block;font-family:var(--f-display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.brand small{color:var(--top-muted);font-size:.78rem}
.ctx{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--top-muted);font-weight:600}
.ctl select{padding:6px 8px;border:1px solid var(--top-line);border-radius:8px;background:rgba(255,255,255,.12);color:var(--top-fg);min-width:140px}
.ctl select option{color:#0E1A3A;background:#FFFFFF}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.who b{font-weight:600;font-size:.9rem}
.who span{font-size:.76rem;color:var(--top-muted)}
.top .btn{background:transparent;border-color:var(--top-line);color:var(--top-fg)}
.top .btn:hover{background:rgba(255,255,255,.12);border-color:var(--top-fg)}
@media (max-width:600px){
  .top-in{padding:8px 12px;gap:6px 10px}
  .brand small{display:none}
  .brand b{font-size:1.15rem}
  .mark{width:36px;height:36px;font-size:11px}
  .top-in{flex-wrap:nowrap}
  .brand{margin-right:0;flex:none}
  .top-in:has(.who) .brand>div:last-child{display:none}
  .ctx{flex:1;min-width:0;align-items:center;flex-wrap:nowrap;gap:8px}
  .who{text-align:left;margin-right:auto;min-width:0}
  .who b,.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl span{display:none}
  .ctl select{min-width:0;max-width:118px;padding:5px 6px}
}
.top :focus-visible{outline-color:var(--gold)}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
@media (min-width:820px){
  .tabs{position:static;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 16px;font-size:.9rem;border-bottom:2px solid transparent}
  .tabs button.on{border-bottom-color:var(--accent);box-shadow:none}
  .tabs button svg{width:18px;height:18px}
}

main{max-width:1180px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
@media (min-width:820px){main{padding-bottom:40px}}

/* cartões e campos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.cols{display:grid;gap:14px}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.stackcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input:not([type]),input[type=date],input[type=time],input[type=number],select.in{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
input[readonly]{background:var(--surface-2);color:var(--muted)}
input.big{font-family:var(--f-num);font-size:1.5rem;padding:10px 12px;text-align:right}
.hint{font-size:.8rem;color:var(--muted)}
.inrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.inrow > input{flex:1 1 200px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.btn.pri:hover{background:var(--cta-hover);border-color:var(--cta-hover)}
.btn.pri[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.wide{width:100%;padding:13px}
.btn.lernota{padding:16px;font-size:1.15rem}
.btn.ghost{background:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap;font-family:var(--f-body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.sem{background:var(--surface-2);color:var(--muted)}
.pill.nc{background:none;color:var(--muted);outline:1px dashed var(--muted)}
.mini{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-left:6px;font-family:var(--f-body)}
.okline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}

/* visor da balança */
.lcd{background:var(--lcd-bg);color:var(--lcd-fg);border-radius:8px;padding:10px 14px;font-family:var(--f-num);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.lcd-top,.lcd-bot{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;letter-spacing:.08em;color:var(--lcd-dim);text-transform:uppercase}
.lcd-top span:first-child{color:var(--lcd-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcd-val{font-size:2.6rem;font-weight:600;text-align:right;line-height:1.1;letter-spacing:.02em}
.lcd-val small{font-size:1rem;margin-left:6px;color:var(--lcd-dim)}

/* botões de peça e carne */
.gbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gbtn button{padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.gbtn button:hover{border-color:var(--accent)}
.gbtn button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pickbox{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;cursor:pointer;font:inherit;font-size:.92rem;color:var(--fg)}
.pickbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickbox.on{border-color:var(--accent)}
.somar{display:flex;align-items:center;gap:8px}.somar #somabox{margin-left:auto}
.sbox{text-align:right;border-radius:10px;padding:6px 10px;background:var(--bg)}.sbox small{display:block;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:inherit;opacity:.85}
.sbox b{white-space:nowrap;font-family:var(--f-num);font-weight:600;font-size:1.02rem}.sbox .dif{text-transform:none;letter-spacing:0;font-size:.75rem}
.sbox.ok{background:var(--ok-soft);color:var(--ok)}.sbox.wa{background:var(--warn-soft);color:var(--warn)}
.treinobar{background:var(--cta);color:#fff;font-size:.82rem;padding:6px 16px;text-align:center}.treinobar b{letter-spacing:.06em}
.treinobtn{width:100%;border:2px dashed var(--cta);color:#C2500E;background:#FFF4EC}
.exlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}.exh{background:#FFF4EC;color:#C2500E;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.exi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px;font:inherit;text-align:left;color:var(--fg);cursor:pointer}.exi small{display:block;color:var(--muted);font-size:.78rem}
.treinodel{align-self:center;color:var(--crit)}
.segcx{display:grid;grid-template-columns:1fr 2fr;gap:6px}.segcx button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 8px;font:inherit;font-weight:600;font-size:.95rem;color:var(--fg);cursor:pointer}
.segcx button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.segcx small{font-weight:400;opacity:.85}
.lnk{align-self:flex-end;border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;font-size:.82rem;padding:2px;cursor:pointer}
.cxoutra{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:.85rem}.cxoutra input{width:90px;text-align:right}
.opt1{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;font:inherit;font-size:.92rem;color:var(--fg);cursor:pointer}.opt1:first-child{border-top:0}.opt1.on{background:var(--accent);color:#fff;font-weight:600}
#csug{max-height:260px;overflow:auto}
.cg{border-top:1px solid var(--line)}.cg:first-child{border-top:0}
.cgh{display:flex;justify-content:space-between;align-items:baseline;width:100%;border:0;background:none;padding:10px 0;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.cgh small{color:var(--muted);font-size:.8rem;margin-left:6px}.cgh .num{font-family:var(--f-num);font-weight:600;text-align:right}.cgh .num small{display:block}
.cpc{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);padding:2px 0 6px 18px}
.cpc .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}.pchip{font-size:.8rem;font-weight:600;background:var(--bg);color:var(--accent);border-radius:999px;padding:3px 10px;font-family:var(--f-num)}
.pesnova .nm{display:flex;flex-direction:column;line-height:1.25}.pesnova .nm small{font-size:.75rem;color:var(--muted)}
.pes li.pesed{flex-wrap:wrap;gap:6px}.pesed label{display:flex;align-items:center;gap:6px;font-size:.85rem}.pesed input{width:90px;text-align:right}
.optlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.optsep{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:6px 10px;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:var(--surface);padding:9px 10px;text-align:left;font:inherit;font-size:.92rem;color:var(--fg);cursor:pointer}
.opt .ck{width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;flex:none;display:grid;place-items:center}
.opt.on .ck{background:var(--accent);border-color:var(--accent)}.opt.on .ck::after{content:'✓';color:#fff;font-size:12px;line-height:1}
.gbtn .mais{grid-column:1/-1;font-family:inherit;font-weight:600;font-size:.8rem;text-transform:none;letter-spacing:0;padding:6px;color:var(--accent);background:none;border-style:dashed}
.prevpes{margin:0;font-size:.85rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px}
.nfpl{display:flex;flex-direction:column;align-items:flex-end;flex:none;white-space:nowrap}.nfpl small{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.nfpl b{font-family:var(--f-num);font-size:1.05rem}
.nfver{flex-basis:100%;align-self:flex-start}
.nfitens{flex-basis:100%;display:flex;flex-direction:column}.nfitens div{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-top:1px solid var(--line)}.nfitens b{font-family:var(--f-num);font-weight:600}
.lbl small{text-transform:none;letter-spacing:0;font-weight:400}
.sug button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 11px;cursor:pointer;display:flex;gap:6px;align-items:baseline;font-size:.92rem}
.sug button:hover{border-color:var(--accent)}
.sug button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sug button.on .code{color:inherit;opacity:.7}
.code{font-family:var(--f-num);font-size:.8em;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:.84rem}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.foto-add{width:76px;height:76px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;text-align:center}
.foto-add:hover{border-color:var(--accent);color:var(--accent)}
.cambig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:150px;border:2px dashed var(--accent);border-radius:14px;background:var(--surface);color:var(--accent);font-weight:700;font-size:1.05rem;cursor:pointer}
.cambig svg{width:44px;height:44px}
.galeria{align-self:center;font-size:.88rem;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px}
.nfres{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.nfres b{font-family:var(--f-display);font-size:1.3rem}
.hint.apel{margin:-4px 0 4px;font-size:.78rem}
.pz.comnota{border-bottom:0;padding-bottom:2px}
.pz select.falta{border-color:var(--warn);color:var(--warn)}.nfres span{color:var(--muted);font-size:.88rem}
.compbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--fg)}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.t td.n,.t th.n{text-align:right}
.t tr:last-child td{border-bottom:0}
.t tr.sub td{background:var(--surface-2);font-weight:600}
.t tr.tot td{background:var(--fg);color:var(--bg);font-weight:600}
.t tr.tot .pill{background:var(--bg)}
.t td:first-child,.t th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.t th:first-child{background:var(--surface-2)}
.t tr.sub td:first-child{background:var(--surface-2)}
.t tr.tot td:first-child{background:var(--fg)}
.t td.ind{padding-left:24px;color:var(--muted)}
.t td small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.t tr.tot td small{color:inherit;opacity:.75}
.mt td{vertical-align:middle}
.mt input,.mt select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%;min-width:90px}
.mt td.n input{text-align:right;font-family:var(--f-num)}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

.pes{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pes li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:.9rem}
.pes li:last-child{border-bottom:0}
.pes .i{font-family:var(--f-num);color:var(--muted);font-size:.8rem;width:2.2em;flex:none}
.pes .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pes .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px}
.pes .x:hover{color:var(--crit)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm ul{margin:0;padding-left:18px;color:var(--crit);font-size:.88rem}

function split(t){const o=[];let r=t;while(r>0.05){let b=Math.min(r,rnd(11,27));if(r-b<4)b=r;o.push(r3(b));r-=b}return o}

function gerar(){
  const confs=[],notas=[],cont={},vend={},pend=[],seq={bf:48210,vv:15530,ss:7720,as:30110};
  if(!DEMO)return{confs,notas,cont,vend,pend};
  for(const L of SIM){
    cont[L.id]={};vend[L.id]={};const st={},rt={};
    PROD.forEach(p=>{st[p.c]=p.d*L.f*8;rt[p.c]=L.id===4?rnd(.065,.09):rnd(.02,.055)});
    for(let day=1;day<=30;day++){
      const wd=new Date(2026,8,day).getDay(), iso='2026-09-'+pad(day);
      const doDia=day===30?ENTREGAS.filter(e=>e.f==='bf'||e.f==='vv'):ENTREGAS.filter(e=>e.wd.includes(wd));
      for(const e of doDia){
        const F=FM[e.f], nNF=++seq[e.f], chave=makeChave(F.cnpj,nNF,'2609'), pes=[], q={};
        e.cods.forEach(c=>{split(PM[c].d*L.f*e.cob*1.06*rnd(.92,1.1)).forEach(b=>{pes.push({c,b,t:0,g:grupoSim(e.f,c)});q[c]=(q[c]||0)+b})});
        let nf;
        if(e.f==='bf'){
          const tot=Object.values(q).reduce((a,b)=>a+b,0);
          const rend=(L.id===4&&R()<.6)?rnd(.67,.7):rnd(.735,.765);
          const k=r3(tot/rend), v=r2(k*28);
          nf={itens:[{desc:'CARNE RESFRIADA DE BOVINO COM OSSO - QUARTO TRASEIRO SERROTE (VACA)',ncm:'02012020',kg:k,v}],kg:k,v};
        }else{
          const itens=e.cods.map(c=>{const nb=pes.filter(p=>p.c===c).length,miss=L.id===4&&R()<.35;
            const k=r3(q[c]*(1+(miss?rnd(.15,.3):rnd(-.002,.007))));
            return{desc:descNF(c)+' - '+(nb+(miss?1:0))+',00',c,kg:k,v:r2(k*PM[c].custo)}});
          nf={itens,kg:r3(itens.reduce((s,i)=>s+i.kg,0)),v:r2(itens.reduce((s,i)=>s+i.v,0))};
        }
        notas.push({id:`n${L.id}-${e.f}-${day}`,loja:L.id,forn:e.f,nf:String(nNF),chave,data:iso,...nf,origem:'exemplo',fonte:'XML'});
        if(day>=29){pend.push({loja:L.id,forn:e.f,nf:String(nNF),chave});continue}
        Object.entries(q).forEach(([c,k])=>st[c]+=k);
        if(R()<.12)continue; /* chegou e ninguém conferiu: a nota entra no balanço mesmo assim */
        const hm=pad(6+Math.floor(rnd(0,3)))+':'+pad(Math.floor(rnd(0,60)));
        confs.push({id:`s${L.id}-${e.f}-${day}`,loja:L.id,forn:e.f,nf:String(nNF),chave,data:iso,hora:hm,fim:iso,conferente:'Conferente (exemplo)',uid:'c'+L.id,pes,fotos:[],origem:'exemplo',log:[`Finalizada em ${dBR(iso)} ${hm} por Conferente (exemplo)`]});
      }
      if(day>=29)continue;
      vend[L.id][iso]={};
      const fac=(wd===5||wd===6)?1.25:wd===0?.8:1;
      PROD.forEach(p=>{const k=Math.max(0,Math.min(p.d*L.f*rnd(.85,1.15)*fac,st[p.c]/(1+rt[p.c])*.95));st[p.c]-=k*(1+rt[p.c]);vend[L.id][iso][p.c]={kg:r3(k),rs:r2(k*p.preco*rnd(.965,.995))}});
      if(CONTS.includes(iso))cont[L.id][iso]=Object.fromEntries(PROD.map(p=>[p.c,r3(st[p.c])]));
    }
  }
  return{confs,notas,cont,vend,pend};
}

/* ---------- sincronização com o servidor ----------
   Cada nota recebida, conferência, contagem etc. é um documento na tabela "registros".
   BASE guarda a última versão que o servidor confirmou; o que difere dela é enviado.
   Tudo também fica numa cópia local, então dá para continuar pesando sem internet e enviar depois. */
function arrT(get,set,key){return{list:()=>get().map(x=>[String(key(x)),x]),put:(k,d)=>{const a=get(),i=a.findIndex(x=>String(key(x))===k);if(i>=0)a[i]=d;else a.push(d)},del:k=>set(get().filter(x=>String(key(x))!==k))}}
function objT(get){return{list:()=>Object.entries(get()),put:(k,d)=>{get()[k]=d},del:k=>{delete get()[k]}}}
const T={
  rec:arrT(()=>S.recs,v=>S.recs=v,r=>r.id),
  conf:arrT(()=>S.apps,v=>S.apps=v,c=>c.id),
  nota:arrT(()=>S.notasApp,v=>S.notasApp=v,n=>nkey(n)),
  cont:arrT(()=>S.conts,v=>S.conts=v,c=>c.loja+'|'+c.data),
  loja:arrT(()=>S.lojas,v=>S.lojas=v,l=>l.id),
  prod:objT(()=>S.prods),
  vimp:objT(()=>S.vimp),
  apel:objT(()=>S.apel), /* nome do item na nota do fornecedor → produto do cadastro */
  used:{list:()=>S.used.map(ch=>[ch,{ch}]),put:k=>{if(!S.used.includes(k))S.used.push(k)},del:k=>{S.used=S.used.filter(x=>x!==k)}},
  set:{list:()=>[['set',S.set]],put:(k,d)=>{S.set=mergeSet(d)},del:()=>{}},
};
const lojaDoc=(t,d,k)=>['rec','conf','nota','cont'].includes(t)?d.loja:t==='vimp'?(+k.split('|')[0]||null):null;
/* espelho da regra do banco (app_private.pode_escrever): evita mandar o que o servidor recusaria */
function podeEscrever(t,loja){const u=curUser();if(!u)return false;if(u.perfil==='gestor')return true;if(t==='used'||t==='apel')return true;
  if(u.perfil==='gerente'&&t==='prod')return true;
  return (u.perfil==='gerente'?['rec','conf','cont','nota','vimp']:['rec','conf','cont']).includes(t)&&loja===u.loja}
const SY={on:false,busy:false,cursor:null,base:new Map(),pend:0,off:false,tPush:null,tCache:null,avisou:false};
function docsAtuais(){const m=new Map();for(const [t,h] of Object.entries(T))for(const [k,d] of h.list())m.set(t+'|'+k,{t,k,d});return m}
function splitKey(key){const i=key.indexOf('|');return[key.slice(0,i),key.slice(i+1)]}
function aplicarRemoto(r){const h=T[r.tipo];if(!h)return;const key=r.tipo+'|'+r.id;
  if(r.excluido){h.del(r.id);SY.base.delete(key)}else{h.put(r.id,r.dados);SY.base.set(key,{j:JSON.stringify(r.dados),loja:r.loja})}}
function depoisDeReceber(){Object.assign(PM,S.prods);S.lojas.sort((a,b)=>a.id-b.id);resetIdx()}
async function puxar(inicial){
  if(!SY.on)return false;
  let mudou=false,de=0;const atual=inicial?null:docsAtuais();
  const desde=SY.cursor?new Date(new Date(SY.cursor).getTime()-5000).toISOString():null;
  for(;;){
    let q=sb.from('registros').select('tipo,id,loja,dados,excluido,atualizado_em').order('atualizado_em').order('tipo').order('id').range(de,de+999);
    if(desde)q=q.gt('atualizado_em',desde);
    const {data,error}=await q;if(error)throw error;
    for(const r of data){
      const key=r.tipo+'|'+r.id,b=SY.base.get(key),rj=r.excluido?null:JSON.stringify(r.dados);
      if(!SY.cursor||r.atualizado_em>SY.cursor)SY.cursor=r.atualizado_em;
      if((b?b.j:null)===rj)continue;
      const cur=atual?.get(key),cj=cur?JSON.stringify(cur.d):null;
      if(inicial||cj===(b?b.j:null)){aplicarRemoto(r);mudou=true}
      else if(r.excluido)SY.base.delete(key); /* mexi aqui sem internet: a minha versão vale e é enviada */
      else SY.base.set(key,{j:rj,loja:r.loja});
    }
    if(data.length<1000)break;de+=1000;
  }
  if(mudou){depoisDeReceber();guardarCache()}
  return mudou;
}
async function enviar(){
  if(!SY.on||SY.busy||TREINO)return;SY.busy=true;
  try{
    const cur=docsAtuais(),rows=[];
    for(const [key,x] of cur){const j=JSON.stringify(x.d),b=SY.base.get(key);if(b&&b.j===j)continue;
      const loja=lojaDoc(x.t,x.d,x.k);if(podeEscrever(x.t,loja))rows.push({row:{tipo:x.t,id:x.k,loja,dados:x.d,excluido:false},key,j,loja})}
    for(const [key,b] of SY.base)if(!cur.has(key)){const [t,k]=splitKey(key);if(podeEscrever(t,b.loja))rows.push({row:{tipo:t,id:k,loja:b.loja,dados:{},excluido:true},key,j:null,loja:b.loja})}
    SY.pend=rows.length;syncUI();
    if(!rows.length){SY.off=false;return}
    const ok=x=>{if(x.j==null)SY.base.delete(x.key);else SY.base.set(x.key,{j:x.j,loja:x.loja})};
    const {error}=await sb.from('registros').upsert(rows.map(x=>x.row),{onConflict:'tipo,id'});
    if(!error)rows.forEach(ok);
    else{let falhou=0;for(const x of rows){const r=await sb.from('registros').upsert(x.row,{onConflict:'tipo,id'});if(r.error)falhou++;else ok(x)}
      if(falhou&&!SY.avisou){SY.avisou=true;toast('Alguns dados não foram aceitos pelo servidor. Avise a Diretoria.')}}
    SY.off=false;SY.pend=0;guardarCache();
  }catch(e){SY.off=true}
  finally{SY.busy=false;syncUI()}
}

const FURL=new Map();
async function subirFoto(dataUrl,loja){

function divergencias(c){

  const out=[],gx={},cx={};
  x.itens.forEach(it=>{const g=classNF(it);gx[g]=(gx[g]||0)+it.kg;if(g==='caixaria'||g==='outros'){const k=it.c||matchProd(it.desc)||(g==='outros'?'MIUDO':'?');cx[k]=(cx[k]||0)+it.kg}});

function resumo(c){const m={};c.pes.forEach(p=>{const k=m[p.c]||(m[p.c]={c:p.c,n:0,kg:0});k.n++;k.kg+=p.b-p.t});return Object.values(m).map(x=>({...x,kg:r3(x.kg)})).sort((a,b)=>a.c.localeCompare(b.c,undefined,{numeric:true}))}
const totalKg=c=>r3(c.pes.reduce((s,p)=>s+p.b-p.t,0));
/* compara nomes ignorando acento, hífen e pontuação ("CONTRA FILE" = "Contra-filé") */
const limpa=s=>' '+norm(s).replace(/[^a-z0-9]+/g,' ').trim()+' ';
const descLimpa=d=>String(d??'').split(/\n|TRIB\.? APROX|\sST: ?MVA/i)[0].trim(); /* só o nome: sem as linhas de tributos que o frigorífico põe na descrição */

function matchProd(desc){const a=S.apel?.[chaveApel(desc)]?.c;if(a&&PM[a])return a;const d=limpa(desc);return prodList().filter(p=>!p.sistema).filter(p=>p.n.length>3&&!p.inteira&&!/^PC/.test(p.c)).sort((a,b)=>b.n.length-a.n.length).find(p=>d.includes(limpa(p.n)))?.c||null}

/* ---------- item da nota → grupo (COM OSSO / SEM OSSO / MIÚDO + NCM) ---------- */
function classNF(it){
  if(it.gd)return it.gd;
  const d=norm(it.desc), ncm=String(it.ncm||'');
  if(/^0206|^0504/.test(ncm)||/miud|figado|mocoto|bucho|rumen|coracao|rabo|lingua|tripa/.test(d))return 'outros';
  if(/traseiro/.test(d))return 'traseiro';
  if(/dianteiro/.test(d))return 'dianteiro';
  if(/ponta de agulha/.test(d))return 'costela';
  if(/sem osso/.test(d)||/^02013|^02023/.test(ncm))return 'caixaria';
  const c=it.c||matchProd(it.desc);
  if(c&&PM[c])return PM[c].cx?'caixaria':(pecasOf(PM[c])[0]||'outros');
  return 'outros';
}
const volNF=it=>{const m=String(it.desc).match(/-\s*(\d+)[,.]0+\s*$/);return m?+m[1]:null};
function grupoItem(it){const k=classNF(it);if(k!=='outros')return 'Bovino';const c=it.c||matchProd(it.desc);return c&&PM[c]?.bov?'Bovino':'Outros'}

/* ---------- resultado da conferência (nota × pesado, por peça) ---------- */
const RANK={ok:0,warn:1,crit:2};
const stDe=dif=>{const a=Math.abs(dif);return a>=S.set.tolCrit?'crit':a>=S.set.tolAt?'warn':'ok'};
function analise(c){
  const n=notaConf(c), conf=totalKg(c);
  if(!n||!(n.kg>0))return{st:'sem',conf,n:null,grupos:[]};
  const gs={};GR.forEach(g=>gs[g.k]={k:g.k,n:g.n,nf:0,conf:0,inteira:0,cortes:0,pes:[],itens:[]});
  c.pes.forEach(p=>{const g=gs[p.g||grupoPadrao(p.c)]||gs.outros,k=p.b-p.t;g.conf+=k;g.pes.push(p);if(PM[p.c]?.inteira)g.inteira+=k;else g.cortes+=k});
  n.itens.forEach(it=>{const g=gs[classNF(it)];g.nf+=it.kg;g.itens.push(it)});
  const grupos=[];let pior=0;
  for(const g of Object.values(gs)){
    if(!g.nf&&!g.conf)continue;
    const pE=Math.min((S.set.perdaEsp[g.k]||0)/100,.95);
    const equiv=g.inteira+g.cortes/(1-pE);
    g.esp=equiv>0?1-g.conf/equiv:pE;
    g.perda=g.nf>0?1-g.conf/g.nf:null;
    g.st=g.perda==null?'warn':stDe((g.perda-g.esp)*100);
    g.lista=resumo({pes:g.pes});
    if(g.k==='caixaria'){
      const m={};
      g.itens.forEach(it=>{const c=it.c||matchProd(it.desc)||('?'+it.desc);const r=m[c]||(m[c]={c,nome:PM[c]?.n||it.desc,nf:0,vol:0,volOk:true,conf:0,cx:0});r.nf+=it.kg;const v=volNF(it);if(v==null)r.volOk=false;else r.vol+=v});
      g.pes.forEach(p=>{const r=m[p.c]||(m[p.c]={c:p.c,nome:PM[p.c]?.n||p.c,nf:0,vol:0,volOk:false,conf:0,cx:0});r.conf+=p.b-p.t;r.cx++});
      g.cxItens=Object.values(m).map(r=>{r.perda=r.nf>0?1-r.conf/r.nf:null;r.falta=r.volOk&&r.vol>0?Math.max(0,r.vol-r.cx):0;
        r.st=r.nf===0?'warn':r.falta>0?'crit':stDe(r.perda*100-(S.set.perdaEsp.caixaria||0));return r});
      g.st=['ok','warn','crit'][Math.max(RANK[g.st],...g.cxItens.map(r=>RANK[r.st]))];
    }
    pior=Math.max(pior,RANK[g.st]);grupos.push(g);
  }
  return{st:['ok','warn','crit'][pior],n,conf,nf:n.kg,perda:1-conf/n.kg,grupos};
}

/* ---------- planilha do PDV (Comparativo de Vendas por Produto) ---------- */
function subDoArquivo(nome){const n=norm(nome);
  if(/miud/.test(n))return{sub:'Miúdos',bov:false};
  if(/especia/.test(n))return{sub:'Carnes especiais',bov:true};
  if(/salgad/.test(n))return{sub:'Carnes salgadas',bov:true};
  if(/lingui|salsich/.test(n))return{sub:'Linguiças',bov:null};
  if(/bovin/.test(n))return{sub:'Carnes bovinas',bov:true};
  return{sub:'Açougue',bov:true};
}
const titulo=s=>String(s||'').trim().replace(/^CB\s+/i,'').replace(/\s+KG$/i,'').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
function bovPadrao(desc,f){const d=norm(desc);if(/cliente/.test(d))return false;if(f.bov===null)return /caseir/.test(d);return f.bov}
function pecaPadrao(nome){const d=norm(nome);
  if(/fraldinha/.test(d))return ['costela','traseiro'];
  if(/costela|ponta de agulha/.test(d))return ['costela'];
  if(/acem|paleta|peito|musculo diant|cupim|segunda|pescoco|peixinho|miolo/.test(d))return ['dianteiro'];
  if(/picanha|alcatra|contra|file|coxao|patinho|maminha|musculo|cha de fora|lagarto|bananinha|bisteca|aranha|cordao|chambari/.test(d))return ['traseiro'];
  return []}
async function lerPlanilha(file){
  if(typeof XLSX==='undefined')throw new Error('leitor');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,raw:true});
  const hi=rows.findIndex(r=>r&&r.some(c=>norm(c).trim()==='codigo')&&r.some(c=>norm(c).trim()==='quantidade'));
  if(hi<0)throw new Error('cabecalho');
  const h=rows[hi].map(c=>norm(c).trim()), ix=k=>h.indexOf(k);
  const iC=ix('codigo'),iD=ix('descricao'),iQ=ix('quantidade'),iV=ix('venda realizada'),iCA=ix('custo atual'),iVA=ix('venda atual');
  const f=subDoArquivo(file.name), out=[];
  for(const r of rows.slice(hi+1)){
    const code=String(r[iC]??'').trim(); if(!/^\d+$/.test(code))continue;
    const q=num(r[iQ]),v=iV>=0?num(r[iV]):NaN,ca=iCA>=0?num(r[iCA]):NaN,va=iVA>=0?num(r[iVA]):NaN;
    out.push({c:code,n:titulo(r[iD]),kg:isFinite(q)?q:0,rs:isFinite(v)?v:0,custo:isFinite(ca)?ca:0,preco:isFinite(va)?va:0,sub:f.sub,bov:bovPadrao(r[iD],f)});
  }
  return out;
}
function upsertProd(x){
  const ex=PM[x.c], bov=ex?.bovSet?ex.bov:x.bov, pecas=ex?.pecaSet?pecasOf(ex):pecaPadrao(x.n);
  const cx=ex?.cxSet?ex.cx:(bov&&pecas.length>0);
  const p={c:x.c,n:x.n||ex?.n||x.c,sub:x.sub,custo:x.custo||ex?.custo||0,preco:x.preco||ex?.preco||0,bov,pecas,peca:pecas[0]||'outros',cx,
    bovSet:!!ex?.bovSet,pecaSet:!!ex?.pecaSet,cxSet:!!ex?.cxSet,g:bov?'Bovino':'Outros',d:0,imp:true};
  PM[x.c]=p;S.prods[x.c]=p;
}
/* produtos bovinos sem peça reconhecida pelo nome herdam a peça dos que têm o mesmo custo atual (o sistema usa um custo por peça) */
function pecaPorCusto(){
  const imp=Object.values(PM).filter(p=>p.imp&&p.bov&&!p.pecaSet), moda={};
  ['traseiro','dianteiro','costela'].forEach(k=>{const cnt={};imp.filter(p=>pecasOf(p)[0]===k&&p.custo).forEach(p=>cnt[p.custo]=(cnt[p.custo]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(top)moda[top[0]]=k});
  imp.filter(p=>!pecasOf(p).length&&moda[p.custo]).forEach(p=>{p.pecas=[moda[p.custo]];p.peca=moda[p.custo];if(!p.cxSet)p.cx=true;S.prods[p.c]=p});
}

/* soma dos pesos das linhas ao lado do "+ Outro item", comparada com o peso líquido da nota */
function somaBox(f,ed){const soma=r3(f.out.reduce((t,o)=>t+(num(o.kg)>0?num(o.kg):0),0)), pl=f.ia?.pl||ed?.lida?.pl||0;
  if(!pl)return `<div class="sbox"><small>Soma dos itens</small><b>${kg(soma)} kg</b></div>`;
  const d=r3(soma-pl), ok=Math.abs(d)<=Math.max(.01,pl*.001);
  return `<div class="sbox ${ok?'ok':'wa'}"><small>Soma · nota ${kg(pl)}</small><b>${kg(soma)} kg${ok?' ✓':''}</b>${ok?'':`<small class="dif">${d<0?'faltam':'sobram'} ${kg(Math.abs(d))} kg</small>`}</div>`}

}

/* ---------- BALANÇO CARNE BOVINA (compras pela NF-e: kg e R$) ---------- */
function calc(r){r.cmv=r.ei+r.c-r.ef;r.perdaKg=r.cmv-r.vk;r.perda=r.cmv>0?r.perdaKg/r.cmv:null;r.cmvR=r.eiR+r.cR-r.efR;r.lucro=r.vr-r.cmvR;r.margem=r.vr?r.lucro/r.vr:null;r.markup=r.cmvR?r.lucro/r.cmvR:null;return r}
function balBov(ids,a,b){
  const T={ei:0,eiR:0,c:0,cR:0,ef:0,efR:0,vk:0,vr:0};let nNotas=0,nSem=0,imp=null;
  for(const l of ids){
    const ea=contDe(l,a)||{},eb=contDe(l,b)||{};
    T.ei+=bovKg(ea);T.eiR+=bovRs(ea);T.ef+=bovKg(eb);T.efR+=bovRs(eb);
    allNotas().filter(n=>n.loja===l&&n.data>a&&n.data<=b).forEach(n=>{
      const sv=n.itens.reduce((s,i)=>s+(i.v||0),0),sk=n.itens.reduce((s,i)=>s+i.kg,0);let tem=false;
      n.itens.forEach(it=>{if(grupoItem(it)!=='Bovino')return;tem=true;T.c+=it.kg;T.cR+=n.v*(sv?it.v/sv:(sk?it.kg/sk:1))});
      if(tem){nNotas++;if(!confDe(n))nSem++}
    });
    const key=`${l}|${a}|${b}`;
    if(ids.length===1&&S.vimp[key]){imp=S.vimp[key];Object.entries(imp.dados).forEach(([c,v])=>{if(PM[c]?.bov){T.vk+=v.kg;T.vr+=v.rs}})}
    else Object.entries(G.vend[l]||{}).forEach(([iso,dd])=>{if(iso>a&&iso<=b)Object.entries(dd).forEach(([c,v])=>{if(PM[c]?.bov){T.vk+=v.kg;T.vr+=v.rs}})});
  }
  return{T:calc(T),nNotas,nSem,imp};
}
const perdaSt=p=>p==null?'sem':p*100>=S.set.perdaCrit?'crit':p*100>=S.set.perdaAt?'warn':'ok';
const term=(l,v,res)=>`<span class="term${res?' res':''}"><small>${l}</small>${v}</span>`, op=o=>`<span class="op">${o}</span>`;

  const kp=`<div class="kpis">

  const tbl=`<div class="tw"><table class="t"><thead><tr><th></th><th class="n">Kg</th><th class="n">R$</th></tr></thead><tbody>
    <tr><td>Estoque inicial (EI)<small>contagem de ${dBR(a)} · custo atual</small></td><td class="n">${kg(T.ei)}</td><td class="n">${rs(T.eiR)}</td></tr>
    <tr><td>+ Compras<small>${B.nNotas} notas fiscais${B.nSem?`, ${B.nSem} sem conferência`:''} · valor total da nota</small></td><td class="n">${kg(T.c)}</td><td class="n">${rs(T.cR)}</td></tr>
    <tr><td>− Estoque final (EF)<small>contagem de ${dBR(b)} · custo atual</small></td><td class="n">${kg(T.ef)}</td><td class="n">${rs(T.efR)}</td></tr>
    <tr class="sub"><td>= CMV</td><td class="n">${kg(T.cmv)}</td><td class="n">${rs(T.cmvR)}</td></tr>
    <tr><td>Vendas<small>${imp?'PDV (planilha importada)':DEMO?'PDV (exemplo)':'sem planilha do PDV'}</small></td><td class="n">${kg(T.vk)}</td><td class="n">${rs(T.vr)}</td></tr>
    <tr class="sub"><td>Perda = CMV − Vendas</td><td class="n">${kg(T.perdaKg)}</td><td class="n"><span class="pill ${perdaSt(T.perda)}">${pc(T.perda)}</span></td></tr>
    <tr class="tot"><td>Lucro bruto = Vendas − CMV</td><td class="n"></td><td class="n">${rs(T.lucro)}</td></tr></tbody></table></div>`;
  const fx=`<div class="formula">
    <div class="eq">${op('(')}${term('CMV kg',kg(T.cmv))}${op('−')}${term('Vendas kg',kg(T.vk))}${op(') ÷')}${term('CMV kg',kg(T.cmv))}${op('=')}${term('% Perda',pc(T.perda),1)}</div>

function addPes(){
  const d=S.draft,b=num(d.peso),t=num(d.tara)||0;
  if(!d.grupo){toast('Escolha a peça primeiro.');return}
  const sel=d.sel||[], caixa=sel.length!==1;
  if(!(b>0)){toast('Digite o peso da balança.');focusId('peso');return}
  if(t>=b){toast('A tara está maior que o peso da balança.');return}
  const td=t>0&&!S.set.taras.some(x=>Math.abs(x.kg-t)<.0005);
  const base={b:r3(b),t:r3(t),g:d.grupo,h:nowHM(),...(td?{td:true}:{})};
  if(caixa){d.pes.push({c:'CX',nc:proxCaixa(d),cont:[...sel],...base});d.sel=[]} /* uma carne só continua marcada para pesar a próxima igual */
  else d.pes.push({c:sel[0],...base});
  S.contAberto=false;
  if(d.pes.length===1&&!d.comp){d.hora=nowHM();const r=S.recs.find(x=>x.id===d.rec);if(r)r.lock=true}

function addPeca(){
  const d=S.cd,b=num(d.peso);
  if(!d.prod){toast('Escolha a carne primeiro.');focusId('cq');return}

}
/* diminui a foto sem abrir ela inteira na memória: celular simples fecha o app com foto de 50 megapixels */
async function readImg(file,max=900,q=.7){
  let src=null,w=0,h=0,fim=()=>{};
  try{
    if(window.createImageBitmap){try{const b=await createImageBitmap(file,{resizeWidth:Math.round(max*1.2),resizeQuality:'medium',imageOrientation:'from-image'});src=b;w=b.width;h=b.height;fim=()=>b.close()}catch(e){}}
    if(!src){const url=URL.createObjectURL(file);fim=()=>URL.revokeObjectURL(url);
      src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});w=src.naturalWidth;h=src.naturalHeight}
    const sc=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
    cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);const u=cv.toDataURL('image/jpeg',q);cv.width=cv.height=0;return u;
  }catch(e){return null}finally{fim()}
}
/* leitura da DANFE pela foto (função ler-danfe no servidor, com o Gemini) */
let LENDO=null; /* formulário cuja foto está sendo lida; resultado que chega depois de salvar/limpar é descartado */

async function lerDanfe(f,imgs){
  try{if(TREINO)throw new Error('No treino a foto não é lida. Use uma nota de exemplo ou digite os dados.');
    if(!imgs.length)throw new Error('Tire a foto de novo para ler.');
    const r=await fn('ler-danfe',{imagens:imgs});if(S.rf!==f)return;aplicarLeitura(r.nota,r.modelo);
    toast('Nota lida.')}
  catch(e){if(S.rf===f){f.falhou=true;toast(e.message||'Não consegui ler a foto. Digite os dados.')}}
  finally{if(LENDO===f)LENDO=null;save();render()}
}
function aplicarLeitura(n,modelo){refazForn();

  if(n.chave)f.chave=n.chave;
  const F=FCNPJ[n.emitente_cnpj];
  if(F)f.forn=F.id;
  const linhas=[]; let semCarne=0, somaKg=0;
  (n.itens||[]).forEach(it=>{
    if(it.unidade&&!/KG/.test(it.unidade))return;
    somaKg+=it.quantidade;
    const ap=S.apel?.[chaveApel(it.descricao)]?.c, g=classNF({desc:it.descricao,ncm:it.ncm});
    const miudo=/^0206|^0504/.test(String(it.ncm||''))||/miud|figado|mocoto|bucho|rumen|coracao|rabo|lingua|tripa/.test(norm(it.descricao));
    const mp=matchProd(it.descricao); /* corte de caixa vence a palavra da peça: "MUSCULO DIANTEIRO" é músculo, não dianteiro inteiro */
    const c=ap&&(ap.startsWith('G:')||PM[ap])?ap:mp&&PM[mp]?.cx?mp:['traseiro','dianteiro','costela'].includes(g)?'G:'+g:(mp||(miudo?'MIUDO':''));
    if(!c)semCarne++; /* sem cadastro: a linha pede o produto, e o app aprende */
    linhas.push({c,kg:fmt(it.quantidade),desc:descLimpa(it.descricao),...(c?{}:{novo:true})}); /* novo: só estes ensinam o app */
  });
  if(!F&&/^\d{14}$/.test(n.emitente_cnpj||'')){f.forn='c'+n.emitente_cnpj;f.fornNome=n.emitente_nome||('CNPJ '+fmtCNPJ(n.emitente_cnpj))} /* fornecedor sem cadastro: usa o da nota */
  f.out=linhas.length?linhas:linhasPadrao();
  f.falhou=false;f.corr=false;
  f.ia={modelo,soma:r3(somaKg),pl:+n.peso_liquido||0,emitente:F?'':`${n.emitente_nome} (CNPJ ${fmtCNPJ(n.emitente_cnpj)})`,semCarne,itens:(n.itens||[]).length};
}
function parseXML(txt){
  const d=new DOMParser().parseFromString(txt,'text/xml');
  if(d.getElementsByTagName('parsererror').length)throw new Error('xml');
  const g=(el,t)=>el?.getElementsByTagName(t)[0]?.textContent||'';
  const dets=[...d.getElementsByTagName('det')]; if(!dets.length)throw new Error('sem itens');
  const itens=dets.map(det=>{const p=det.getElementsByTagName('prod')[0];return{desc:g(p,'xProd'),ncm:g(p,'NCM'),cod:g(p,'cProd'),un:g(p,'uCom'),kg:parseFloat(g(p,'qCom'))||0,v:parseFloat(g(p,'vProd'))||0}});
  const kgItens=itens.filter(i=>/kg/i.test(i.un)), base=kgItens.length?kgItens:itens;
  const emit=d.getElementsByTagName('emit')[0], dest=d.getElementsByTagName('dest')[0], vNF=parseFloat(g(d,'vNF'));
  const id=d.getElementsByTagName('infNFe')[0]?.getAttribute('Id')||'';
  return{nNF:String(+g(d,'nNF')||''),cnpj:g(emit,'CNPJ'),xNome:g(emit,'xNome'),dest:g(dest,'CNPJ'),data:(g(d,'dhEmi')||'').slice(0,10),chave:id.replace(/\D/g,''),
    itens:base.map(i=>({desc:i.desc,ncm:i.ncm,cod:i.cod,c:matchProd(i.desc),kg:r3(i.kg),v:r2(i.v)})),kg:r3(base.reduce((s,i)=>s+i.kg,0)),v:r2(vNF||itens.reduce((s,i)=>s+i.v,0))};
}
function addNota(n){
  const dup=allNotas().some(x=>nkey(x)===nkey(n));
  S.notasApp=S.notasApp.filter(x=>nkey(x)!==nkey(n));S.notasApp.push(n);resetIdx();save();
  return dup;
}
async function importarPlanilhas(files,comVendas){
  const dados={},nomes=[];let linhas=0;
  for(const f of files){const ls=await lerPlanilha(f);nomes.push(f.name);ls.forEach(x=>{upsertProd(x);linhas++;if(comVendas){const o=dados[x.c]||(dados[x.c]={kg:0,rs:0});o.kg+=x.kg;o.rs+=x.rs}})}
  pecaPorCusto();save();return{dados,nomes,linhas};
}

  'tara-add':()=>{S.set.taras.push({n:'Nova tara',kg:0});save();render()},
  'tara-rm':el=>{S.set.taras.splice(+el.dataset.i,1);save();render()},
  'lj-add':()=>{const id=Math.max(0,...S.lojas.map(l=>l.id))+1;S.lojas.push({id,nome:'Nova loja',cidade:'',cnpj:'',cert:false});save();render()},
  'u-add':async()=>{const f=S.uForm,nome=f.nome.trim(),usuario=f.usuario.trim().toLowerCase();
    if(!nome){toast('Informe o nome da pessoa.');return}
    if(!/^[a-z0-9][a-z0-9._-]{2,30}$/.test(usuario)){toast('Usuário: pelo menos 3 caracteres, só letras minúsculas, números, ponto ou hífen (sem espaço e sem acento).');focusId('u-usuario');return}
    S.uBusy=true;render();
    try{const r=await fn('usuarios',{acao:'criar',nome,usuario,perfil:f.perfil,loja:f.perfil==='gestor'?null:+f.loja||1});
      S.uCode={nome,usuario:r.usuario,codigo:r.codigo};S.uForm={nome:'',usuario:'',perfil:f.perfil,loja:f.loja};await carregarUsuarios();toast('Usuário cadastrado. Envie o código para a pessoa.')}
    catch(e){toast(e.message)}
    S.uBusy=false;render()},
  'u-cod':async el=>{const x=S.users.find(u=>u.id===el.dataset.id);if(!x)return;
    try{const r=await fn('usuarios',{acao:'novo_codigo',id:x.id});S.uCode={nome:x.nome,usuario:r.usuario,codigo:r.codigo};await carregarUsuarios();render();scrollTo(0,document.getElementById('ucmsg')?.getBoundingClientRect().top+scrollY-120||0)}
    catch(e){toast(e.message)}},
  'u-off':async el=>{try{await fn('usuarios',{acao:'desativar',id:el.dataset.id});await carregarUsuarios();render();toast('Usuário desativado.')}catch(e){toast(e.message)}},
  'u-on':async el=>{try{await fn('usuarios',{acao:'reativar',id:el.dataset.id});await carregarUsuarios();render();toast('Usuário reativado.')}catch(e){toast(e.message)}},
  'u-code-ok':()=>{S.uCode=null;render()},
  reset:()=>{S.resetAsk=true;render()},
  'reset-no':()=>{S.resetAsk=false;render()},
  'reset-ok':()=>{S.apps=[];S.recs=[];S.rf=newRf(S.loja||1);S.notasApp=[];S.conts=[];S.mods={};S.vimp={};S.used=[];S.prods={};
    Object.keys(PM).forEach(k=>delete PM[k]);PROD.forEach(p=>PM[p.c]={...p});PM.CX={...PCX};PM.MIUDO={...PMI};
    S.set=structuredClone(DEF_SET);S.draft=newDraft(S.loja||1);S.cd=newCd(S.loja||1);S.done=null;S.resetAsk=false;save();render();toast('Dados de exemplo restaurados.')},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el)});

const C={
  rgaleria:t=>C.rfotos(t),
  loja:t=>{S.loja=+t.value;S.openId=null;save();render()},
  rloja:t=>{S.rf.loja=+t.value;save();render()},
  cloja:t=>{S.cd.loja=+t.value;save();render()},
  cdata:t=>{S.cd.data=t.value;save();render()},
  mesC:t=>{S.mesC=t.value;render()},
  mesN:t=>{S.mesN=t.value;render()},
  rforn:t=>{S.rf.forn=t.value;save();render()},
  rdata:t=>{S.rf.data=t.value;save()},
  rnf:t=>{S.rf.nf=t.value.replace(/\D/g,'').replace(/^0+/,'');save();render()},
  rchave:t=>{const v=t.value.replace(/\D/g,'');if(v!==S.rf.chave){applyChave(v);render()}},
  rfotos:async t=>{const fs=[...t.files];if(!fs.length)return;const f=S.rf;SUBINDO++;render();
    try{for(const x of fs){const hi=f.edit?null:await readImg(x,2000,.8), u=await readImg(x,900,.7); /* uma de cada vez: menos memória */
      if(hi){if(LER.f!==f)LER={f,imgs:[]};LER.imgs.push(hi)}if(u)f.fotos.push(await subirFoto(u,f.loja))}}
    finally{SUBINDO--;save();render()}},
  xml:async t=>{const f=t.files[0];if(!f)return;
    try{const x=parseXML(await f.text()),c=getConf(S.openId);
      addNota({id:'na'+Date.now(),loja:c.loja,forn:c.forn,nf:String(+c.nf),chave:x.chave||c.chave,data:c.data,itens:x.itens,kg:x.kg,v:x.v,origem:'app',fonte:'XML'});
      setConf(c.id,{log:[...c.log,`XML ${f.name} importado em ${nowBR()} por ${quemSou()}`]});
      toast(x.nNF&&+x.nNF!==+c.nf?`XML importado, mas ele é da NF ${+x.nNF} e a conferência é da NF ${c.nf}. Confira.`:'XML importado.');
    }catch(e){toast('Não foi possível ler esse arquivo. Envie o XML da NF-e.')}
    render()},
  /* receber nota pelo XML: cria a nota (vale para o balanço) e a nota recebida (vai para Conferir) */
  rxml:async t=>{const f=t.files[0];if(!f)return;
    try{const x=parseXML(await f.text()),F=FCNPJ[x.cnpj];
      const lj=S.lojas.find(l=>l.cnpj&&l.cnpj===x.dest), loja=S.loja?S.loja:(lj?lj.id:(+S.rf.loja||1));
      const forn=F?F.id:'c'+x.cnpj, nf=x.nNF||'0';
      if(S.recs.some(r=>nkey(r)===nkey({loja,forn,nf}))){toast(`A NF ${nf} já foi recebida.`);return}
      addNota({id:'na'+Date.now(),loja,forn,fornNome:F?undefined:x.xNome,nf,chave:x.chave,data:x.data||todayISO(),itens:x.itens,kg:x.kg,v:x.v,origem:'app',fonte:'XML'});
      S.recs.push({id:'r'+Date.now(),loja,chave:x.chave,nf:String(+nf),forn,fornNome:F?undefined:x.xNome,data:todayISO(),hora:nowHM(),fotos:[],dig:null,via:'xml',por:quemSou(),uid:S.user});
      S.rf=newRf(S.rf.loja);save();render();
      toast(`NF ${nf} · ${F?F.nome:x.xNome} recebida pelo XML${S.loja&&lj&&lj.id!==S.loja?' (atenção: o CNPJ do destinatário é de outra loja)':''}. Toque em Conferir quando for pesar.`);
    }catch(e){toast('Não foi possível ler esse arquivo. Envie o XML da NF-e.')}},
  xmln:async t=>{const fs=[...t.files];if(!fs.length)return;let ok=0,erro=0;const msgs=[];
    for(const f of fs){try{const x=parseXML(await f.text()),F=FCNPJ[x.cnpj];
      const lj=S.lojas.find(l=>l.cnpj&&l.cnpj===x.dest), loja=lj?lj.id:(S.loja||+S.nForm.loja||1);
      addNota({id:'na'+Date.now()+ok,loja,forn:F?F.id:'c'+x.cnpj,fornNome:F?undefined:x.xNome,nf:x.nNF||'0',chave:x.chave,data:x.data||todayISO(),itens:x.itens,kg:x.kg,v:x.v,origem:'app',fonte:'XML'});
      ok++;msgs.push(`NF ${x.nNF} → ${lojaNome(loja)}${lj?'':' (CNPJ não cadastrado; usei a loja escolhida)'}`)}catch(e){erro++}}
    render();toast(ok?`${ok} nota(s) importada(s). ${msgs.slice(0,2).join('; ')}${erro?`. ${erro} arquivo(s) não lido(s).`:''}`:'Não foi possível ler esses arquivos. Envie o XML da NF-e.')},
  xls:async t=>{const fs=[...t.files];if(!fs.length)return;
    try{const r=await importarPlanilhas(fs,true);if(!r.linhas){toast('Nenhum produto encontrado na planilha.');return}
      S.vimp[`${S.loja}|${S.bal.a}|${S.bal.b}`]={nome:r.nomes.join(', '),dados:r.dados};save();render();
      const fora=Object.keys(r.dados).filter(c=>!PM[c]?.bov).length;
      toast(`${Object.keys(r.dados).length} produtos importados de ${fs.length} arquivo(s)`+(fora?`; ${fora} ficam fora do balanço bovino (veja Ajustes → Produtos).`:'.'))}
    catch(e){erroPlanilha(e)}},
  xlsp:async t=>{const fs=[...t.files];if(!fs.length)return;
    try{const r=await importarPlanilhas(fs,false);render();toast(`${r.linhas} produtos atualizados a partir de ${fs.length} arquivo(s). Confira a peça de cada um.`)}catch(e){erroPlanilha(e)}},
  balA:t=>{S.bal.a=t.value;render()},
  balB:t=>{S.bal.b=t.value;render()},
};
document.addEventListener('change',e=>{const t=e.target,id=t.id||'';
  if(C[id])return C[id](t);
  let m;
  if((m=id.match(/^lj-(nome|cidade|cnpj|cert|modo)-(\d+)$/))){const l=S.lojas.find(x=>x.id===+m[2]);if(!l)return;
    l[m[1]]=m[1]==='cert'?t.value==='1':m[1]==='cnpj'?t.value.replace(/\D/g,''):t.value.trim();save();if(m[1]!=='cidade')render();return}
  if((m=id.match(/^pg-(traseiro|dianteiro|costela)-(.+)$/))){const p=PM[m[2]];if(!p)return;
    const ps=pecasOf(p).filter(k=>k!==m[1]);if(t.checked)ps.push(m[1]);p.pecas=['traseiro','dianteiro','costela'].filter(k=>ps.includes(k));
    p.peca=p.pecas[0]||'outros';p.pecaSet=true;S.prods[p.c]=p;save();return}
  if((m=id.match(/^peca-n-(\d+)$/))){const x=S.set.pecas[+m[1]];if(x&&t.value.trim())x.n=t.value.trim();save();return}
  if((m=id.match(/^tara-(n|kg)-(\d+)$/))){const x=S.set.taras[+m[2]];if(!x)return;if(m[1]==='n')x.n=t.value.trim();else{const v=num(t.value);if(isFinite(v))x.kg=r3(v)}save();return}
  if((m=id.match(/^pe-(\w+)$/))){const v=num(t.value);if(isFinite(v)){S.set.perdaEsp[m[1]]=v;save()}return}
  if((m=id.match(/^(pb|pcx|pp)-(.+)$/))){const p=PM[m[2]];if(!p)return;
    if(m[1]==='pb'){p.bov=t.checked;p.bovSet=true;p.g=p.bov?'Bovino':'Outros'}
    else if(m[1]==='pcx'){p.cx=t.checked;p.cxSet=true}
    else{p.peca=t.value;p.pecaSet=true}
    S.prods[p.c]=p;save();return}
  if((m=id.match(/^cl-(c|kg)-(\d+)$/))){const l=S.cd.linhas[+m[2]];if(!l)return;l[m[1]]=t.value;save();document.getElementById('cres').innerHTML=cresHTML();return}
  if((m=id.match(/^ro-(c|kg)-(\d+)$/))){const o=S.rf.out[+m[2]];if(!o)return;o[m[1]]=t.value;
    if(m[1]==='c'&&o.novo&&o.desc&&t.value){S.apel[chaveApel(o.desc)]={c:t.value,desc:o.desc,forn:S.rf.forn,por:quemSou(),em:nowBR()};toast(`Aprendido: “${o.desc}” = ${t.value.startsWith('G:')?GRB[t.value.slice(2)]:PM[t.value]?.n||t.value}.`)}
    save();render();return}
  if(id.startsWith('n-')){const k=id.slice(2);S.nForm[k]=k==='nf'?t.value.replace(/\D/g,'').replace(/^0+/,''):t.value;return}
  if(id.startsWith('u-')){const k=id.slice(2);S.uForm[k]=t.value;if(k==='perfil')render();return}
  if((m=id.match(/^forn-(nome|cnpj)-(\d+)$/))){const x=S.set.forns[+m[2]];if(!x)return;
    if(m[1]==='nome'){if(t.value.trim())x.nome=t.value.trim()}else{const c=t.value.replace(/\D/g,'');if(c&&c.length!==14){toast('O CNPJ tem 14 dígitos.');return}x.cnpj=c}
    save();render();return}
  if(id==='cfg-confPesos'){S.set.confPesos=t.checked;save();render();return}
  if(id.startsWith('set-')){const v=num(t.value);if(isFinite(v)){S.set[id.slice(4)]=v;save()}}
  else if(id.startsWith('zap-')){S.set.zap[id.slice(4)]=t.value.trim();save()}
});
document.addEventListener('input',e=>{const t=e.target;let m;
  if((m=t.id.match(/^ro-kg-(\d+)$/))){const o=S.rf.out[+m[1]];if(o){o.kg=t.value;const b=document.getElementById('somabox');if(b)b.innerHTML=somaBox(S.rf,S.rf.edit?S.recs.find(r=>r.id===S.rf.edit):null);saveDrafts()}return}
  if(t.id==='u-nome'||t.id==='u-usuario'){S.uForm[t.id.slice(2)]=t.value;return}
  if(/^n-(nf|kg|v)$/.test(t.id)){S.nForm[t.id.slice(2)]=t.value;return}
  if((m=t.id.match(/^cl-kg-(\d+)$/))){const l=S.cd.linhas[+m[1]];if(l){l.kg=t.value;document.getElementById('cres').innerHTML=cresHTML();save()}return}
  if(t.id==='q'){document.getElementById('sug').innerHTML=chipsGrupo(S.draft.grupo,t.value,S.draft.prod)}
  else if(t.id==='cq'){const e=document.getElementById('csug');if(e)e.innerHTML=cListHTML(t.value)}
  else if(t.id==='ctara'){S.cd.tara=t.value;save()}
  else if(t.id==='peso'||t.id==='tara'){S.draft[t.id]=t.value;const pv=document.getElementById('prevpes');if(pv)pv.innerHTML=prevPes();save()}
  else if(t.id==='cpeso'){S.cd.peso=t.value;save()}
  else if(t.id==='rchave'){const v=t.value.replace(/\D/g,'');if(v.length===44&&v!==S.rf.chave){applyChave(v);render()}}
  else if(/^ro-kg-\d+$/.test(t.id)){const o=S.rf.out[+t.id.split('-')[2]];if(o){o.kg=t.value;save()}}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.id==='q'){e.preventDefault();const q=norm(t.value.trim());const m=prodsDoGrupo(S.draft.grupo).find(p=>p.c.toLowerCase().startsWith(q)||norm(p.n).includes(q));if(q&&m){S.draft.prod=m.c;save();render();focusId('peso')}}
  else if(t.id==='cq'){e.preventDefault();const q=norm(t.value.trim());const m=prodList().filter(p=>p.bov).find(p=>p.c.toLowerCase().startsWith(q)||norm(p.n).includes(q));if(q&&m){S.cd.prod=m.c;S.cAberto=false;save();render();focusId('cpeso')}}
  else if(t.id==='peso'||t.id==='tara'){e.preventDefault();S.draft[t.id]=t.value;addPes()}
  else if(t.id==='cpeso'){e.preventDefault();S.cd.peso=t.value;addPeca()}
});
render();
sb.auth.getSession().then(({data})=>{if(data.session)entrouComSessao();else{let t=false;try{t=sessionStorage.getItem('acougue-treino')==='1'}catch(e){}if(t)entrarTreino();else{S.boot=false;render()}}}).catch(()=>{S.boot=false;render()});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){saiu();render()}});
</script>
